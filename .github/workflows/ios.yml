# Builds an unsigned DOOM.ipa (UZDoom for iPhone and iPad): DOOM, DOOM II,
# Final DOOM and the re-release's add-ons, with touch controls. Sideload it,
# then copy your own .wad files into Files > On My iPhone > DOOM. No game
# data is in the app.
#
# Every run keeps the .ipa as a workflow artifact. Where it goes:
#   - a push to ios, or a manual run of ios with "release" left empty: the
#     public "ios-latest" prerelease (DOOM.ipa, no game data), as always.
#   - runs on other ios-* branches (work in progress) publish nothing.
#   - a manual run of branch ios with "release" set to a tag such as ios-v0.1
#     (gh workflow run ios.yml --ref ios -f release=ios-v0.1): a release for
#     that tag, created at the commit being built, with
#     docs/ios/RELEASE_NOTES.md from that commit as its text and only the
#     files in RELEASE_IPAS attached, marked as the latest release. A version
#     with a '-' in it (ios-v0.2-beta1) is a prerelease instead and isn't
#     marked latest. ios-latest is left alone. The run stops before building
#     if the tag isn't ios-v<version>, is already on another commit, or the
#     notes have no "### What's in <tag>" line. Running it again for the same
#     tag on the same commit updates that release. After publishing, it adds
#     the release to the AltStore / SideStore source
#     (packaging/ios/altstore-source.json) on the ios branch; if that part
#     fails, the release is still out: add it by hand.
# (Modelled on the owner's Raze port, .github/workflows/ios.yml.)
name: iOS

on:
  push:
    branches: [ "ios", "ios-*" ]
    # A push that only changes the AltStore / SideStore source doesn't build
    # (a release run commits it; the app doesn't include it)
    paths-ignore:
      - 'packaging/ios/altstore-source.json'
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty to update ios-latest as usual.
        required: false
        default: ''

concurrency:
  # Pushes and ordinary runs as before (a newer one cancels the older one on
  # the same branch); release runs for one tag go one at a time and are never
  # cancelled.
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.release == '' }}

env:
  IOS_MIN: "15.0"
  SDL_TAG: release-2.32.8
  OPENAL_TAG: 1.24.3
  VPX_TAG: v1.15.2
  MOLTENVK_TAG: v1.4.2
  # The tag a manual run was asked to release; empty for pushes and ordinary runs.
  RELEASE_TAG: ${{ inputs.release }}
  # The .ipa files a release gets, space-separated
  RELEASE_IPAS: DOOM.ipa
  # Release title; the tag's version is added after it (ios-v0.1 -> "... v0.1").
  RELEASE_TITLE: "DOOM (UZDoom) for iOS"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      build_date: ${{ steps.stamp.outputs.date }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Before the build: a release needs the ios branch, a usable tag and notes
    # written for it.
    - name: Check release tag and notes
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if [ "$GITHUB_REF" != "refs/heads/ios" ]; then
          echo "::error::Releases are made from the ios branch (this run is on $GITHUB_REF)."
          exit 1
        fi
        case "$RELEASE_TAG" in
          ios-v*) ;;
          *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
        esac
        if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
          echo "::error::\"$RELEASE_TAG\" can't be a git tag name."
          exit 1
        fi
        # A tag already there must be on this commit, or the release's .ipa and
        # its tag's source would differ (publishing doesn't move a tag).
        REFS=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
          echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
          exit 1
        fi
        if ! grep -qxF "### What's in ${RELEASE_TAG}" docs/ios/RELEASE_NOTES.md; then
          echo "::error file=docs/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
          exit 1
        fi

    - name: Select newest Xcode
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version

    - name: Host tools
      run: brew install ninja libvpx

    - name: Restore iOS dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: deps
        key: ios-deps-${{ env.SDL_TAG }}-${{ env.OPENAL_TAG }}-${{ env.VPX_TAG }}-${{ env.IOS_MIN }}-${{ hashFiles('ios/build_deps.sh') }}

    - name: Build SDL2, OpenAL Soft, libsndfile and libvpx for iOS
      if: steps.deps.outputs.cache-hit != 'true'
      run: ios/build_deps.sh "$PWD/deps"

    - name: Save iOS dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: deps
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build host tools
      run: |
        set -e
        cmake -S . -B host -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DHAVE_VULKAN=OFF -DHAVE_GLES2=OFF -DOSX_COCOA_BACKEND=ON -DNO_OPENAL=ON \
          -DVPX_INCLUDE_DIR=$(brew --prefix libvpx)/include -DVPX_LIBRARIES=$(brew --prefix libvpx)/lib/libvpx.dylib \
          > host-configure.log 2>&1 || { tail -60 host-configure.log; exit 1; }
        cmake --build host --target zipdir lemon re2c
        test -f host/ImportExecutables.cmake

    - name: Configure
      run: |
        set -e
        DEPS=$PWD/deps
        # Homebrew's pkg-config would hand the iOS build Mac libraries (WebP:
        # the game's own copy is built instead): hide them
        export PKG_CONFIG_LIBDIR=/nonexistent PKG_CONFIG_PATH=
        cmake -S . -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN -DCMAKE_BUILD_TYPE=Release \
          -DIMPORT_EXECUTABLES=$PWD/host/ImportExecutables.cmake \
          -DSDL2_INCLUDE_DIR=$DEPS/include/SDL2 \
          "-DSDL2_LIBRARY=$DEPS/lib/libSDL2main.a;$DEPS/lib/libSDL2.a" \
          -DOPENAL_INCLUDE_DIR=$DEPS/include/AL \
          -DOPENAL_LIBRARY=$DEPS/lib/libopenal.a \
          -DSNDFILE_INCLUDE_DIR=$DEPS/include -DSNDFILE_LIBRARY=$DEPS/lib/libsndfile.a \
          "-DIOS_SNDFILE_CODECS=$DEPS/lib/libvorbisenc.a;$DEPS/lib/libvorbis.a;$DEPS/lib/libFLAC.a;$DEPS/lib/libopus.a;$DEPS/lib/libogg.a" \
          -DVPX_INCLUDE_DIR=$DEPS/include -DVPX_LIBRARIES=$DEPS/lib/libvpx.a \
          -DNO_GTK=ON -DFORCE_NO_LTO=ON -DFORCE_INTERNAL_WEBP=ON \
          "-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local" \
          -DDOOM_IOS_VERSION=0.1.${{ github.run_number }}

    - name: Build
      run: |
        cmake --build build -- -k 0 > build.log 2>&1 || {
          grep -E "error:|FAILED:|undefined symbol|ld: |CMake Error" build.log | head -120
          echo "----- end of the build log -----"
          tail -80 build.log | cut -c1-400
          echo "::error::Build failed"
          exit 1
        }
        grep -E "(ios/).*warning:" build.log | sort -u | head -60 || true
        tail -3 build.log

    # The app ended at start when ZWidget had no backend on iOS ("Unable to
    # create init zwidget"): the iOS build must have its own, without windows
    - name: Check the start-up pieces in the app
      run: |
        set -e
        BIN=$(find build -maxdepth 4 -path "*DOOM.app/DOOM" -type f | head -1)
        test -n "$BIN"
        LC_ALL=C grep -aqF "iOS: ZWidget backend: none" "$BIN" || { echo "::error::The iOS ZWidget backend is not in the app"; exit 1; }
        if LC_ALL=C grep -aqF "Unable to create init zwidget" "$BIN"; then echo "::error::The app still asks ZWidget for a Win32 or SDL2 backend"; exit 1; fi
        echo "ZWidget: the iOS backend is in $BIN"

    # The build stamp (the run number and the UTC date), shown under the
    # open MENU tray as "build 80 · Nov 9" and on the release's first line
    - name: Build stamp
      id: stamp
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Package .ipa
      run: |
        set -e
        APP=$(find build -maxdepth 3 -name "DOOM.app" -type d | head -1)
        echo "App bundle: $APP"
        ls -la "$APP"
        test -f "$APP/uzdoom.pk3"
        PL="$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PL"
        /usr/libexec/PlistBuddy -c "Delete :SWBuildNumber" "$PL" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Delete :SWBuildDate" "$PL" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :SWBuildNumber string ${{ github.run_number }}" "$PL"
        /usr/libexec/PlistBuddy -c "Add :SWBuildDate string ${{ steps.stamp.outputs.date }}" "$PL"
        plutil -lint "$PL"
        plutil -p "$PL" | grep -E "CFBundle(Short)?Version|SWBuild"
        curl -sSfL -o mvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_TAG/MoltenVK-ios.tar"
        tar xf mvk.tar
        mkdir -p "$APP/Frameworks"
        cp -R MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework "$APP/Frameworks/"
        cp MoltenVK/LICENSE "$APP/Frameworks/MoltenVK.framework/LICENSE"
        lipo -info "$APP/Frameworks/MoltenVK.framework/MoltenVK"
        codesign --force --sign - --timestamp=none "$APP/Frameworks/MoltenVK.framework"
        codesign --force --sign - --timestamp=none "$APP"
        mkdir -p ipa/Payload
        cp -R "$APP" ipa/Payload/
        # No game data in the app: no .wad file may be in it
        if find ipa/Payload -iname '*.wad' | grep -q .; then echo "::error::A .wad file is in the app"; exit 1; fi
        (cd ipa && zip -qry ../DOOM.ipa Payload)
        ls -la DOOM.ipa

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: DOOM-ios
        path: DOOM.ipa

  release:
    name: ${{ inputs.release != '' && format('Publish release {0}', inputs.release) || 'Publish to "iOS latest" prerelease' }}
    needs: build
    if: github.ref == 'refs/heads/ios'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Release runs only: the notes and the AltStore source's script from the
    # run's commit. Kept first, as checkout empties the folder it checks out
    # into.
    - name: Get release notes
      if: env.RELEASE_TAG != ''
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          docs/ios/RELEASE_NOTES.md
          packaging/ios/update_altstore_source.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - uses: actions/download-artifact@v4
      with:
        name: DOOM-ios
        path: out

    # Pushes and ordinary manual runs; a release run leaves ios-latest alone.
    - name: Publish to "ios-latest" prerelease
      if: env.RELEASE_TAG == ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ios-latest
        target_commitish: ${{ github.sha }}
        name: iOS latest build
        prerelease: true
        make_latest: false
        body: |
          Build ${{ github.run_number }} · ${{ needs.build.outputs.build_date }}
          Development build of DOOM (UZDoom) for iPhone and iPad, rebuilt after every push to the `ios` branch (run ${{ github.run_number }}, commit ${{ github.sha }}). It may not have been tried yet.
          DOOM.ipa is unsigned: sideload it, then copy your own .wad files (doom.wad, doom2.wad, tnt.wad, plutonia.wad and any add-ons) into Files > On My iPhone > DOOM. No game data is included.
        files: out/DOOM.ipa

    # Release runs: only the files in RELEASE_IPAS, none with game data, the
    # title and whether it's a prerelease (a '-' in the version, after the
    # "ios-").
    - name: Prepare release
      id: rel
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if ! grep -qxF "### What's in ${RELEASE_TAG}" docs/ios/RELEASE_NOTES.md; then
          echo "::error file=docs/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line."
          exit 1
        fi
        mkdir release
        for ipa in $RELEASE_IPAS; do
          if [ ! -f "out/$ipa" ]; then
            echo "::error::$ipa (in RELEASE_IPAS) wasn't built."
            exit 1
          fi
          # No game data: no .wad (IWADs, add-ons) or .iwad / .ipk3 file in it
          if unzip -Z1 "out/$ipa" | grep -iE '\.(wad|iwad|ipk3|ipk7)$'; then
            echo "::error::$ipa has game files in it (above)."
            exit 1
          fi
          cp "out/$ipa" release/
        done
        ls -la release
        VERSION=${RELEASE_TAG#ios-}
        case "$VERSION" in
          *-*) PRERELEASE=true; LATEST=false ;;
          *) PRERELEASE=false; LATEST=true ;;
        esac
        echo "Release \"$RELEASE_TITLE $VERSION\", prerelease $PRERELEASE, latest $LATEST"
        { echo "Build ${{ github.run_number }} · ${{ needs.build.outputs.build_date }}"; echo; cat docs/ios/RELEASE_NOTES.md; } > release-notes.md
        {
          echo "name=$RELEASE_TITLE $VERSION"
          echo "prerelease=$PRERELEASE"
          echo "latest=$LATEST"
        } >> "$GITHUB_OUTPUT"

    - name: Publish release for the tag
      if: env.RELEASE_TAG != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        # Creates the tag at the commit this run built (left out, GitHub would
        # put a new tag on the default branch, trunk)
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.rel.outputs.name }}
        body_path: release-notes.md
        prerelease: ${{ steps.rel.outputs.prerelease }}
        make_latest: ${{ steps.rel.outputs.latest }}
        files: release/*.ipa
        fail_on_unmatched_files: true

    # The AltStore / SideStore source (packaging/ios/altstore-source.json)
    # gets the release just published: a new entry with the size, SHA-256,
    # date, download link and a summary of the notes
    # (packaging/ios/update_altstore_source.py), committed to the ios branch
    # (the source's address points there; the default branch is upstream's).
    # It's a commit by GITHUB_TOKEN (which starts no workflow run), marked
    # [skip ci], and the file is in paths-ignore, so it publishes nothing.
    # continue-on-error: if anything here fails, the release (already out)
    # still counts as a success.
    - name: Add the release to the AltStore / SideStore source
      if: env.RELEASE_TAG != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ios
      run: |
        set -euo pipefail
        trap 'echo "::warning::The AltStore / SideStore source was not updated for ${RELEASE_TAG}. The release itself is published; add it to packaging/ios/altstore-source.json by hand."' ERR
        SRC="$RUNNER_TEMP/altstore-source"
        rm -rf "$SRC"
        git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SRC"
        git -C "$SRC" config user.name "github-actions[bot]"
        git -C "$SRC" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for attempt in 1 2 3; do
          # The script and the notes come from the commit just built; the
          # source file from the newest ios branch
          python3 -I packaging/ios/update_altstore_source.py \
            --source "$SRC/packaging/ios/altstore-source.json" \
            --tag "$RELEASE_TAG" --notes docs/ios/RELEASE_NOTES.md \
            $(for ipa in $RELEASE_IPAS; do echo "--ipa release/$ipa"; done)
          if git -C "$SRC" diff --quiet; then
            echo "The source already has ${RELEASE_TAG}"
            break
          fi
          git -C "$SRC" commit --quiet -am "iOS: add ${RELEASE_TAG} to the AltStore / SideStore source [skip ci]"
          if git -C "$SRC" push --quiet origin "HEAD:${SOURCE_BRANCH}"; then
            echo "Added ${RELEASE_TAG} to the source on ${SOURCE_BRANCH}"
            break
          fi
          if [ "$attempt" = 3 ]; then
            false # gives up (the warning above)
          fi
          # Someone pushed in between: start again from the new branch head
          git -C "$SRC" fetch --quiet --depth 1 origin "$SOURCE_BRANCH"
          git -C "$SRC" reset --quiet --hard FETCH_HEAD
        done
        rm -rf "$SRC"
